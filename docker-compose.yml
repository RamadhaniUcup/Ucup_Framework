version: '3.8'

services:
  # menambahkan service postgre
  postgres-db:
    image: postgres:16-alpine
    container_name: harkat_postgres_container
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: supersecretpassword
      POSTGRES_DB: harkat_store_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data_volume:/var/lib/postgresql/data

volumes:
  postgres-data_volume:
